services:
  postgres:
    image: postgres:16-alpine
    container_name: gidra-postgres
    environment:
      POSTGRES_DB: gidra
      POSTGRES_USER: gidra
      POSTGRES_PASSWORD: gidra
    ports:
      - "5432:5432"
    volumes:
      - gidra-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gidra -d gidra"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend/Gidra.Api
    container_name: gidra-api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=gidra;Username=gidra;Password=gidra
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  gidra-postgres:
